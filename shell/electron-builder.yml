appId: com.glorynian.dsh-harbor
productName: DSH Harbor
directories:
  output: release
files:
  - dist/**
  - package.json
  - dsh-plugins/**
  - build/icon.png
  - "!node_modules/.cache"
# The shell spawns the dsh core as a CHILD node process (system Node), which
# cannot read asar at all — so the ENTIRE node_modules tree must live unpacked
# (the core resolves its ~dozens of deps from the real filesystem, scoped and
# non-scoped alike). Unpacked files are excluded from the asar (no duplication).
npmRebuild: false
asarUnpack:
  - node_modules/**
  - dsh-plugins/**
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish:
  provider: github
  owner: glorynian1124-ops
  repo: dsh-harbor
